[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "suru"
version = "0.1.0"
description = "Sheffield Urban Response Unit hackathon digital twin"
requires-python = ">=3.11"
dependencies = [
  "osmnx", "networkx", "geopandas", "shapely", "scikit-learn",
  "numpy",
  "openai", "ollama", "opencv-python-headless", "pillow", "pydantic",
  "streamlit", "pydeck", "plotly", "pandas", "psutil",
]

[tool.setuptools]
py-modules = ["state_schema", "game_session", "sheffield_sim", "knowledge_base", "agent_orchestrator", "app", "generate_assets"]
